<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scal=1">
    <title>comments</title>
    <!-- Bootstrap ya Tailwind CSS link kar sakte hain -->
     <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      .navbar-nav .nav-link{
        color: rgba(255,255,255,0.75);
        transition: color 0.2s ease-in-out;
      }
      .navbar-nav .nav-link:hover{
        color: #ffffff !important;
      }

      
       body{
            padding-top: 85px !important;
            background-image: url('/images/bodyimg-4.jpg');
            background-size: cover;
            background-position: center;
            animation: moveSpaceBackground 60s linear infinite;
         }


         @keyframes moveSpaceBackground{
            0%{
              background-position: 0 0;
            }
            100%{
              background-position: 1000px 1000px;
            }
         }

         .card, .blog-card{
            background: rgba(15, 20, 35, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(10px);
            border-radius: 12px;
            color: #ffffff;
          }

          .navbar{
            background-color: rgba(10, 14, 28, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
          }
          .footer{
            background-color: rgba(10, 14, 28, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
          }
        

          .table{
            color: #ffffff !important;
          }
          .table th, .table td{
            background-color: transparent !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.2);
          }
          /* .card{
            background-color: rgba(15, 20, 35, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
          } */

          .card, .card.p-4, .card.p-5{
            background-color: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            border: 1px solid rgba(255, 255, 255, 0.18) !important;
            color: #ffffff;
          }
    </style>

</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">
          <img th:src="@{/images/logo.jpg}" alt="" width="60" height="40" class="rounded-5">
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <!--  -->
            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/dashboard}">Posts</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/addPost}">New Post</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/admin/comments}">Comments</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" href="/">Logout</a>
            </li>

          </ul>
        </div>
      </div>

      <!-- <div>
        <a href="/" class="btn btn-danger mx-4">Logout</a>
      </div> -->
 
    </nav>
    </div>

    <div class="container my-5 ">
      <div class="card p-4">
        <h2 class="text-center fw-bold">All Comments List</h2>
        <div class="table-responsive">
        <table class="table table-bordered mt-4">
            <thead>
                <tr>
                    <th>S.NO</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Comment</th>
                    <th>Created On</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="comment : ${comments}">
                    <td th:text="${comment.commentId}"></td>
                    <td th:text="${comment.name}"></td>
                    <td th:text="${comment.email}"></td>
                    <td th:text="${comment.comment}"></td>
                    <th th:text="${comment.createdOn}"></th>
        
                    <td>                
                        <a th:href="@{/deleteComment(id=${comment.commentId})}" class="btn btn-danger btn-sm">Delete</a>                        
                    </td>
                </tr>
            </tbody>
        </table>
        </div>
        </div>
        <!-- <a href="/dashboard" class="btn btn-primary">Back to Dashboard</a> -->
    </div>
  

    <footer class="footer text-center py-3 border-top mt-auto ">
      <div class="container">
        <p class="mb-0 text-white">©copy: 2026 Blog App. All right reserved.</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

</body>
</html>
