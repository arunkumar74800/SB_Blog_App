<!doctype html>
<html lang="en" xmlns:th="http:/www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
      .navbar-nav .nav-link{
        color: rgba(255,255,255,0.75);
        transition: color 0.2s ease-in-out;
      }
      .navbar-nav .nav-link:hover{
        color: #ffffff !important;
      }

         body{
            background-image: url('/images/bodyimg-4.jpg');
            background-size: cover;
            animation: moveSpaceBackground 60s linear infinite;
         }

         @keyframes moveSpaceBackground{
            0%{
              background-position: 0 0;
            }
            100%{
              background-position: 1000px 1000px;
            }
         }
         .card, .blog-card{
            background: rgba(15, 20, 35, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 12px;
            color: #ffffff;
          }

          .navbar{
            background-color: rgba(10, 14, 28, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
          }
          .footer{
            background-color: rgba(10, 14, 28, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
          }
    
    </style>

  </head>
  <body>

    <nav class="navbar navbar-expand-lg bg-dark fixed-top" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand text-primary fw-bold" href="/">
          <img th:src="@{/images/blog-4.jpg}" alt="" width="60" height="40" class="rounded-5">
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            
            <li class="nav-item ">
              <a class="nav-link fw-semibold " th:href="@{/}">All Posts</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/signup}">Register</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/login}">Login</a>
            </li>

          </ul>
        </div>
      </div>
    </nav>


    <div class="container mt-5 pt-3">
    <div class="row justify-content-center mt-3">
      <div class="col-md-7 col-lg-5">
        <div class="card shadow border-0 rounded-4 p-4">
          <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Login Here</h3>
            <p class="text-muted-small">Please login to your account</p>
          </div>

          <p th:text="${errorMsg}" class="text-center fw-bold text-danger my-1 mt-0">

          <form th:action="@{login}" th:object="${user}" method="POST">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" name="email" aria-describedby="emailHelp" th:field="*{email}" placeholder="Enter your email" required/>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" th:field="*{password}" placeholder="Password" required />
            </div>
            <div class="d-grid mb-3">
              <button type="submit" class="btn btn-primary rounded-pill fw-bold">LOGIN</button>
            </div> 
            <div class="d-flex justify-content-center align-items-center mb-3 text-small">
              <a href="" class="text-decoration-none fw-bold text-secondary small">Forgot Password?</a>
            </div>
            <div class="text-center text-muted-small">
              Don't have an account?
              <a href="signup" class="text-primary text-decoration-none fw-bold">SIGN UP</a>
            </div>
          </form>
        </div>
      </div>
    </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
