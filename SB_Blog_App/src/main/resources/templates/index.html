<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BlogApp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      .navbar-nav .nav-link{
        color: rgba(255,255,255,0.75);
        transition: color 0.2s ease-in-out;
      }
      .navbar-nav .nav-link:hover{
        color: #ffffff !important;
      }

         body{
            background-image: url('/images/bodyimg-4.jpg');
            background-size: cover;
            animation: moveSpaceBackground 60s linear infinite;
         }

         @keyframes moveSpaceBackground{
            0%{
              background-position: 0 0;
            }
            100%{
              background-position: 1000px 1000px;
            }
         }

          .card, .card.p-4, .card.p-5{
            background-color: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            border: 1px solid rgba(255, 255, 255, 0.18) !important;
            color: #ffffff;
          }

          .navbar{
            background-color: rgba(10, 14, 28, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
          }
          .footer{
            background-color: rgba(10, 14, 28, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
          }
    
    </style>

  </head>
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg bg-dark fixed-top" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand text-primary fw-bold" href="/">
          <img th:src="@{/images/logo.jpg}" alt="" width="60" height="40" class="rounded-5">
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">

          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            
            <li class="nav-item ">
              <a class="nav-link fw-semibold " th:href="@{/}">All Posts</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/signup}">Register</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/login}">Login</a>
            </li>

          </ul>

          <form th:action="@{/search}" method="get" class="d-flex">
            <input
              class="form-control me-2"
              type="text"
              name="keyword"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-light" type="submit">Search</button>
          </form>
        </div>
      </div>
    </nav>


    <div class="container">
      <h2 class="text-center text-white mt-5 pt-4 fw-bold">All Blog Posts</h2>
      <hr>

      <div class="row">
        <div class="col-md-4 mb-3" th:each="post: ${listPosts}">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <!-- Post Title -->
               <h5 class="card-title" th:text="${post.title}">Title</h5>
               <!-- Post content(agar chhota dikhana ho) -->
                <p class="card-text" th:text="${post.description}">description</p>
                <!-- Details page me jane ka link -->
                 <a th:href="@{'/post/' +${post.postId}}" class="btn btn-primary btn-sm">Read more</a>
            </div>
          </div>
        </div>
      </div>
      <!-- Agar xdatabse me koi post nhi hai -->
       <div th:if="${#lists.isEmpty(listPosts)}" class="text-center">
        <p class="text-muted">No blog posts available right now</p>
       </div>
       <div th:each="post: ${posts}">
          <h3 th:text="${post.title}">Title</h3>
          <p th:text="${post.content}">Content</p>
       </div>

    </div>



    <footer class="footer bg-dark text-white text-center py-3 mt-auto border-top">
      <div class="container">
        <p class="mb-0 text-white">©copy: 2026 Blog App. All right reserved.</p>
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
