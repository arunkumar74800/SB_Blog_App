<!doctype html>
<html lang="en" xmlns:th="http:/www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
     crossorigin="anonymous">

    <style>
      .navbar-nav .nav-link{
        color: rgba(255,255,255,0.75);
        transition: color 0.2s ease-in-out;
      }
      .navbar-nav .nav-link:hover{
        color: #ffffff !important;
      }

      
       body{
            padding-top: 85px !important;
            background-image: url('/images/bodyimg-4.jpg');
            background-size: cover;
            animation: moveSpaceBackground 60s linear infinite;
         }

         @keyframes moveSpaceBackground{
            0%{
              background-position: 0 0;
            }
            100%{
              background-position: 1000px 1000px;
            }
         }
         .card, .blog-card{
            background: rgba(15, 20, 35, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(10px);
            border-radius: 12px;
            color: #ffffff;
          }

          .navbar{
            background-color: rgba(10, 14, 28, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
          }
          .footer{
            background-color: rgba(10, 14, 28, 0.9) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
          }
        

          .table{
            color: #ffffff !important;
          }
          .table th, .table td{
            background-color: transparent !important;
            color: #ffffff !important;
            border-color: rgba(255, 255, 255, 0.2);
          }

          .card, .card.p-4, .card.p-5{
            background-color: rgba(15, 23, 42, 0.45) !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            border: 1px solid rgba(255, 255, 255, 0.18) !important;
            color: #ffffff;
          }
    </style>

  </head>
  <body>

    <nav class="navbar navbar-expand-lg fixed-top navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">
          <img th:src="@{/images/logo.jpg}" alt="" width="60" height="40" class="rounded-5">
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav">
            <!--  -->
            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/dashboard}">Posts</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/addPost}">New Post</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" th:href="@{/admin/comments}">Comments</a>
            </li>

            <li class="nav-item">
              <a class="nav-link fw-semibold" href="/">Logout</a>
            </li>

          </ul>
        </div>
      </div>

      <!-- <div>
        <a href="/" class="btn btn-danger mx-4">Logout</a>
      </div> -->
 
    </nav>

    <div class="container">
    <div class="row justify-content-center">
      <!-- <div class="col-md-7 col-lg-5"> -->
        <div class="card shadow border-0 rounded-4 p-4">
          <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Add Post</h3>
          </div>

          <p th:text="${errorMsg}" class="text-center fw-bold text-danger my-1 mt-0">

          <form th:action="@{/savePost}" th:object="${post}" method="post">
            <div class="mb-3 fw-semibold">
              <label for="exampleInputEmail1" class="form-label">Title</label>
              <input type="text" class="form-control" id="title" name="title" th:field="*{title}" placeholder="Post Title" required />
            </div>

            <div class="mb-3 fw-semibold">
              <label for="shortDescription" class="form-label">Short Description</label>
              <input type="text" class="form-control" id="shortDescription" th:field="*{description}" placeholder="Shord Description" required />
            </div>

            <div class="mb-3 fw-semibold">
                <label for="content" class="form-label">Content</label>
                <textarea class="form-control" id="content" name="content" rows="6" th:field="*{content}" placeholder="Enter Content"></textarea>
            </div>

            <div class="d-grid mb-3">
             <button type="submit" class="btn btn-primary rounded-pill fw-bold">SAVE</button>
            </div> 
          </form>
        </div>
      </div>
    </div>
    </div>

    <!-- 1. Pehle CDN Script rakhein -->
    <!-- CKEditor Official Standard CDN -->
<script src="https://cdn.ckeditor.com/4.22.1/standard/ckeditor.js"></script>

<script>
    CKEDITOR.replace('content',{
      removePlugins: 'elementspath'  //ye line add karne se bottom wala path hat jayega
    });
</script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
